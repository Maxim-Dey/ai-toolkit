---
# LoRA для Qwen-Image-2512 на одной H200. Запуск из корня инструмента:
#   cd /workspace/ai-toolkit
#   .venv/bin/python run.py 1_config_qwen_image_2512_lora/train_lora.yaml
#
# Веса в архив не входят. name_or_path указывает на локальный снапшот
# репозитория Qwen/Qwen-Image-2512: в папке должны быть подпапки transformer,
# text_encoder, tokenizer, vae - тогда ничего не качается из сети.
job: extension
config:
  name: "qwen_image_2512_lora_v1"
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/ai-toolkit/1_config_qwen_image_2512_lora/output"
      # без log_dir accelerate не поднимает SummaryWriter и кривых не будет
      log_dir: "/workspace/ai-toolkit/1_config_qwen_image_2512_lora/logs"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        # папка с картинками; подпись - txt-файл с тем же именем
        - folder_path: "/workspace/datasets/my_dataset"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512, 768, 1024 ]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "weighted"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "/workspace/models/Qwen-Image-2512"
        arch: "qwen_image"
        # 141 ГБ VRAM хватает на bf16, квантизация и выгрузка не нужны
        quantize: false
        quantize_te: false
        low_vram: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 1024
        height: 1024
        prompts:
          - "a woman holding a coffee cup, in a beanie, sitting at a cafe"
          - "photo of a man, white background, medium shot, studio lighting"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 3
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
